name: "📱 Improve Mobile PWA"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب "yes" للتأكيد'
        required: true
        default: 'no'

permissions:
  contents: write

jobs:
  improve:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: "📱 Improve service-worker.js"
        run: |
          cat > frontend/mobile/service-worker.js << 'SWEOF'
          // ✅ Cache version يتحدث تلقائياً مع كل deploy
          const CACHE_NAME = 'masar-mobile-v11';

          const APP_ASSETS = [
            './',
            './index.html',
            './manifest.json',
            './service-worker.js',
            './icons/icon-192.png',
            './icons/icon-512.png'
          ];

          self.addEventListener('install', (event) => {
            event.waitUntil(
              caches
                .open(CACHE_NAME)
                .then((cache) => cache.addAll(APP_ASSETS))
                .then(() => self.skipWaiting())
            );
          });

          self.addEventListener('activate', (event) => {
            event.waitUntil(
              caches.keys().then((keys) =>
                Promise.all(
                  keys
                    .filter((key) => key !== CACHE_NAME)
                    .map((key) => caches.delete(key))
                )
              ).then(() => self.clients.claim())
            );
          });

          self.addEventListener('fetch', (event) => {
            if (event.request.method !== 'GET') return;

            const url = new URL(event.request.url);

            // لا نخزن طلبات API
            if (url.origin !== self.location.origin || url.pathname.includes('/api/')) {
              return;
            }

            // صفحات التنقل
            if (event.request.mode === 'navigate') {
              event.respondWith(
                fetch(event.request).catch(() => caches.match('./index.html'))
              );
              return;
            }

            // ملفات التطبيق: Cache first
            event.respondWith(
              caches.match(event.request).then((cached) => {
                if (cached) return cached;

                return fetch(event.request)
                  .then((response) => {
                    const copy = response.clone();
                    caches.open(CACHE_NAME).then((cache) => {
                      cache.put(event.request, copy);
                    });
                    return response;
                  })
                  .catch(() => caches.match('./index.html'));
              })
            );
          });
          SWEOF

      - name: "📱 Add statusMap.js helper"
        run: |
          mkdir -p frontend/mobile/js
          cat > frontend/mobile/js/statusMap.js << 'STATUSEOF'
          // ✅ خريطة الحالات - عربي مع ألوان
          const STATUS_MAP = {
            CREATED:         { ar: 'تم الإنشاء',       color: '#94a3b8', bg: '#f1f5f9' },
            BOOKED:          { ar: 'محجوزة',           color: '#3b82f6', bg: '#eff6ff' },
            APPROVED:        { ar: 'معتمدة',           color: '#06b6d4', bg: '#ecfeff' },
            ARRIVED_GATE:    { ar: 'وصلت البوابة',     color: '#f59e0b', bg: '#fffbeb' },
            ENTERED_PORT:    { ar: 'داخل الميناء',     color: '#f97316', bg: '#fff7ed' },
            AT_BERTH:        { ar: 'في الرصيف',       color: '#8b5cf6', bg: '#f5f3ff' },
            LOADING_COMPLETE:{ ar: 'اكتمل التحميل',    color: '#6366f1', bg: '#eef2ff' },
            PASSED_CUSTOMS:  { ar: 'اجتازت الجمارك',   color: '#14b8a6', bg: '#f0fdfa' },
            EXITED_PORT:     { ar: 'خرجت من الميناء',  color: '#84cc16', bg: '#f7fee7' },
            IN_TRANSIT:      { ar: 'في الطريق',       color: '#eab308', bg: '#fefce8' },
            DELIVERED:       { ar: 'تم التسليم',       color: '#10b981', bg: '#ecfdf5' },
            CANCELLED:       { ar: 'ملغاة',           color: '#ef4444', bg: '#fef2f2' },
          };

          function getStatusLabel(status) {
            return STATUS_MAP[status]?.ar || status || '-';
          }

          function getStatusBadgeHTML(status) {
            const info = STATUS_MAP[status] || { ar: status, color: '#6b7280', bg: '#f3f4f6' };
            return `<span style="
              background: ${info.bg};
              color: ${info.color};
              padding: 4px 12px;
              border-radius: 20px;
              font-size: 12px;
              font-weight: 600;
            ">${info.ar}</span>`;
          }
          STATUSEOF

      - name: "📱 Patch index.html - inject improvements"
        run: |
          python3 << 'PYEOF'
          import re

          with open('frontend/mobile/index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          # 1. Add statusMap.js before </head>
          if 'statusMap.js' not in html:
              html = html.replace('</head>', '<script src="./js/statusMap.js"></script>\n</head>')

          # 2. Replace English status labels with Arabic in trip cards
          # Find status display patterns and wrap with getStatusLabel
          replacements = [
              # Replace raw status display with Arabic
              ('trip.status || \'-\'', 'getStatusLabel(trip.status)'),
              ('trip.status||"-"', 'getStatusLabel(trip.status)'),
              ("trip.status||'-'", "getStatusLabel(trip.status)"),
          ]
          for old, new in replacements:
              html = html.replace(old, new)

          # 3. Improve API error messages
          html = html.replace(
              "خطأ في الاتصال بالخادم",
              "تعذر الاتصال بالخادم. تأكد من اتصال الإنترنت"
          )

          # 4. Add 401 auto-logout
          if '401' not in html or 'auto-logout' not in html:
              logout_code = """
          // ✅ Auto-logout on 401
          function checkAuth(response) {
            if (response && response.status === 401) {
              localStorage.removeItem('masar_token');
              localStorage.removeItem('masar_user');
              location.reload();
            }
            return response;
          }
          """
              html = html.replace('<script>', '<script>\n' + logout_code, 1)

          # 5. Update service worker version reference
          html = html.replace("masar-mobile-v9", "masar-mobile-v11")

          with open('frontend/mobile/index.html', 'w', encoding='utf-8') as f:
              f.write(html)

          print("✅ index.html patched successfully")
          PYEOF

      - name: "📝 Commit"
        run: |
          git config user.name "Masar Bot"
          git config user.email "bot@masar.local"
          git add -A
          git commit -m "📱 Improve Mobile PWA

          - Add Arabic status labels (statusMap.js)
          - Add 401 auto-logout
          - Update service worker cache version
          - Improve error messages
          - Better status display in trip cards
          " || echo "No changes"
          git push

      - name: "✅ Done"
        run: |
          echo "📱 Mobile PWA improvements applied!"

