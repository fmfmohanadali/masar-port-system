name: "🔧 Fix QR Image + Auto-Complete"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب "yes" للتأكيد'
        required: true
        default: 'no'

permissions:
  contents: write

jobs:
  fix:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: "📁 Ensure media directory"
        run: |
          mkdir -p backend/media/qr_codes
          touch backend/media/qr_codes/.gitkeep

      - name: "🔧 Fix views.py - QR image + check_completion"
        run: |
          python3 << 'PYEOF'
          with open('backend/core/views.py', 'r', encoding='utf-8') as f:
              code = f.read()

          changed = False

          # ──────────────────────────────────────────
          # 1. Fix _ensure_qr_token → also generate image
          # ──────────────────────────────────────────
          old_ensure = """    def _ensure_qr_token(self, trip, regenerate=False):
        if regenerate or not trip.qr_token:
            trip.qr_token = trip.generate_qr_token()
            trip.save(update_fields=["qr_token"])

        return trip"""

          new_ensure = """    def _ensure_qr_token(self, trip, regenerate=False):
        if regenerate or not trip.qr_token:
            trip.qr_token = trip.generate_qr_token()
            trip.save(update_fields=["qr_token"])

        if not trip.qr_image:
            trip.generate_qr_image()

        return trip"""

          if old_ensure in code:
              code = code.replace(old_ensure, new_ensure)
              changed = True
              print("✅ [1/4] Fixed _ensure_qr_token: added image generation")
          else:
              print("⚠️  [1/4] _ensure_qr_token pattern not found")

          # ──────────────────────────────────────────
          # 2. Fix issue_qr → generate QR token + image
          # ──────────────────────────────────────────
          if 'generate_qr_token' not in code.split('def issue_qr')[-1].split('def ')[0] if 'def issue_qr' in code else '':
              old_link = """        obj.linked_trip = trip

            obj.status = "QR_ISSUED"
            obj.save(update_fields=["linked_trip", "status", "updated_at"])"""

              new_link = """        trip.qr_token = trip.generate_qr_token()
            trip.save(update_fields=["qr_token"])
            trip.generate_qr_image()

            obj.linked_trip = trip

            obj.status = "QR_ISSUED"
            obj.save(update_fields=["linked_trip", "status", "updated_at"])"""

              if old_link in code:
                  code = code.replace(old_link, new_link)
                  changed = True
                  print("✅ [2/4] Fixed issue_qr: added QR token + image")
              else:
                  # Try with different indentation
                  alt = "obj.linked_trip = trip\n\n        obj.status = \"QR_ISSUED\""
                  if alt in code and 'generate_qr_token' not in code[code.index(alt)-200:code.index(alt)]:
                      inject = """        trip.qr_token = trip.generate_qr_token()
            trip.save(update_fields=["qr_token"])
            trip.generate_qr_image()

            """
                      code = code.replace(alt, inject + alt)
                      changed = True
                      print("✅ [2/4] Fixed issue_qr (alt pattern)")
                  else:
                      print("⚠️  [2/4] issue_qr pattern not found or already fixed")
          else:
              print("✅ [2/4] issue_qr already has generate_qr_token")

          # ──────────────────────────────────────────
          # 3. Add check_completion endpoint
          # ──────────────────────────────────────────
          if 'check_completion' not in code:
              check_action = '''
    @action(detail=True, methods=["get"])
    def check_completion(self, request, pk=None):
        """التحقق من اكتمال طلب النقل بعد مرور الرحلة بكل نقاط المسح"""
        obj = self.get_object()

        if not obj.linked_trip:
            return Response({
                "can_complete": False,
                "reason": "لا توجد رحلة مرتبطة",
                "trip_status": None,
            })

        trip = obj.linked_trip
        scan_points_passed = list(
            trip.scan_events.select_related("scan_point")
            .values_list("scan_point__point_type", flat=True)
        )

        all_points = ["ENTRY_GATE", "BERTH", "CUSTOMS_ZONE", "EXIT_GATE", "DELIVERY"]
        missing = [p for p in all_points if p not in scan_points_passed]

        can_complete = trip.status == "DELIVERED" and len(missing) == 0

        if can_complete and obj.status == "QR_ISSUED":
            obj.status = "COMPLETED"
            obj.save(update_fields=["status", "updated_at"])

        return Response({
            "can_complete": can_complete,
            "trip_status": trip.status,
            "trip_status_display": trip.get_status_display(),
            "scan_points_passed": scan_points_passed,
            "missing_points": missing,
            "transport_status": obj.status,
        })

'''
              marker = "class TransportOfferViewSet"
              if marker in code:
                  code = code.replace(marker, check_action + marker)
                  changed = True
                  print("✅ [3/4] Added check_completion endpoint")
          else:
              print("✅ [3/4] check_completion already exists")

          # ──────────────────────────────────────────
          # 4. Write
          # ──────────────────────────────────────────
          if changed:
              with open('backend/core/views.py', 'w', encoding='utf-8') as f:
                  f.write(code)
              print("\n✅ views.py saved")
          else:
              print("\nℹ️  No changes needed in views.py")
          PYEOF

      - name: "🔧 Fix services.py - auto-complete on DELIVERED + QR image"
        run: |
          python3 << 'PYEOF'
          with open('backend/core/services.py', 'r', encoding='utf-8') as f:
              code = f.read()

          changed = False

          # ──────────────────────────────────────────
          # 1. Add TransportRequest import
          # ──────────────────────────────────────────
          if 'TransportRequest' not in code:
              code = code.replace(
                  'Trip, ScanPoint, ScanEvent, Notification, AuditLog',
                  'Trip, ScanPoint, ScanEvent, Notification, AuditLog, TransportRequest'
              )
              changed = True
              print("✅ [1/3] Added TransportRequest import")
          else:
              print("✅ [1/3] TransportRequest already imported")

          # ──────────────────────────────────────────
          # 2. Ensure generate_qr_image in quick_create_trip
          # ──────────────────────────────────────────
          if 'generate_qr_image' not in code:
              old_qr = """trip.qr_token = trip.generate_qr_token()
    trip.save(update_fields=['qr_token'])"""
              new_qr = """trip.qr_token = trip.generate_qr_token()
    trip.save(update_fields=['qr_token'])
    trip.generate_qr_image()"""
              if old_qr in code:
                  code = code.replace(old_qr, new_qr)
                  changed = True
                  print("✅ [2/3] Added generate_qr_image to quick_create_trip")
              else:
                  # Try indented version
                  old2 = "trip.qr_token = trip.generate_qr_token()\n              trip.save(update_fields=['qr_token'])"
                  new2 = "trip.qr_token = trip.generate_qr_token()\n              trip.save(update_fields=['qr_token'])\n              trip.generate_qr_image()"
                  if old2 in code:
                      code = code.replace(old2, new2)
                      changed = True
                      print("✅ [2/3] Added generate_qr_image (indented)")
                  else:
                      print("⚠️  [2/3] Could not find QR token pattern")
          else:
              print("✅ [2/3] generate_qr_image already exists")

          # ──────────────────────────────────────────
          # 3. Auto-complete TransportRequest on DELIVERED
          # ──────────────────────────────────────────
          if 'AUTO_COMPLETE' not in code:
              old_return = "    return trip, event"
              auto_complete = """
    # ✅ Auto-complete linked TransportRequest when trip is DELIVERED
    if trip.status == 'DELIVERED':
        try:
            transport_req = TransportRequest.objects.filter(
                linked_trip=trip
            ).exclude(
                status__in=['COMPLETED', 'CANCELLED']
            ).first()

            if transport_req:
                transport_req.status = 'COMPLETED'
                transport_req.save(update_fields=['status', 'updated_at'])
                create_notification(
                    transport_req.requester,
                    'طلب نقل مكتمل',
                    f'تم إكمال طلب النقل للحاوية {transport_req.container_no} بنجاح'
                )
                audit(user, 'AUTO_COMPLETE', 'TransportRequest',
                      transport_req.id, f'Auto-completed after trip {trip.trip_code} delivered')
                logger.info(f"TransportRequest {transport_req.id} auto-completed")
        except Exception as e:
            logger.error(f"Failed to auto-complete transport request: {e}")

    return trip, event"""

              # Replace the LAST "return trip, event" (inside scan_trip)
              last_idx = code.rfind(old_return)
              if last_idx > 0:
                  code = code[:last_idx] + auto_complete + code[last_idx + len(old_return):]
                  changed = True
                  print("✅ [3/3] Added auto-complete logic in scan_trip")
              else:
                  print("⚠️  [3/3] Could not find return statement")
          else:
              print("✅ [3/3] Auto-complete already exists")

          if changed:
              with open('backend/core/services.py', 'w', encoding='utf-8') as f:
                  f.write(code)
              print("\n✅ services.py saved")
          else:
              print("\nℹ️  No changes needed in services.py")
          PYEOF

      - name: "📝 Commit"
        run: |
          git config user.name "Masar Bot"
          git config user.email "bot@masar.local"
          git add -A
          git commit -m "🔧 Fix QR image generation + Auto-complete transport requests

          QR Image Fix:
          - issue_qr: generate QR token + QR image when creating trip
          - _ensure_qr_token: also generate image if missing
          - quick_create_trip: generate QR image after token
          - Create media/qr_codes directory

          Auto-Complete Fix:
          - scan_trip: auto-complete TransportRequest when trip reaches DELIVERED
          - Add check_completion endpoint to verify scan progress
          - Send notification to broker when auto-completed
          - Log in audit trail

          Flow:
          إصدار QR → مسح بوابة دخول → رصيف → جمارك → بوابة خروج
          → تسليم (DELIVERED) → طلب النقل = مكتمل تلقائياً ✅
          " || echo "No changes"
          git push

      - name: "✅ Done"
        run: |
          echo "========================================"
          echo "  🎉 تم الإصلاح!"
          echo "========================================"
          echo ""
          echo "التحسينات:"
          echo "  ✅ صورة QR تتولد مع إصدار الرمز"
          echo "  ✅ طلب النقل يكتمل تلقائياً بعد التسليم"
          echo "  ✅ إشعار للمخلص عند الاكتمال"
          echo ""
          echo "Render سيعمل auto-deploy"

