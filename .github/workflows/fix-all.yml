name: Fix indentation error

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fix views.py indentation
        shell: python3 {0}
        run: |
          with open("backend/core/views.py", "r") as f:
              lines = f.readlines()

          fixed = []
          i = 0
          while i < len(lines):
              line = lines[i]
              stripped = line.strip()
              if stripped == "if not trip.qr_image:":
                  fixed.append("        if not trip.qr_image:\n")
                  i += 1
                  if i < len(lines) and "generate_qr_image" in lines[i]:
                      fixed.append("            trip.generate_qr_image()\n")
                      i += 1
                  continue
              fixed.append(line)
              i += 1

          with open("backend/core/views.py", "w") as f:
              f.writelines(fixed)
          print("OK views.py fixed")

      - name: Fix services.py
        shell: python3 {0}
        run: |
          with open("backend/core/services.py", "r") as f:
              code = f.read()

          if "TransportRequest" not in code:
              code = code.replace(
                  "Trip, ScanPoint, ScanEvent, Notification, AuditLog",
                  "Trip, ScanPoint, ScanEvent, Notification, AuditLog, TransportRequest"
              )

          if "AUTO_COMPLETE" not in code:
              old = "    return trip, event"
              idx = code.rfind(old)
              if idx > 0:
                  lines = [
                      "",
                      "    # Auto-complete TransportRequest when trip is DELIVERED",
                      "    if trip.status == 'DELIVERED':",
                      "        try:",
                      "            tr = TransportRequest.objects.filter(",
                      "                linked_trip=trip",
                      "            ).exclude(status__in=['COMPLETED', 'CANCELLED']).first()",
                      "            if tr:",
                      "                tr.status = 'COMPLETED'",
                      "                tr.save(update_fields=['status', 'updated_at'])",
                      "                create_notification(tr.requester, 'طلب نقل مكتمل',",
                      "                    'تم إكمال طلب النقل بنجاح')",
                      "                audit(user, 'AUTO_COMPLETE', 'TransportRequest',",
                      "                    tr.id, 'Auto-completed')",
                      "        except Exception as e:",
                      "            logger.error('auto-complete failed')",
                      "",
                      "    return trip, event",
                  ]
                  new_code = "\n".join(lines)
                  code = code[:idx] + new_code + code[idx + len(old):]

          with open("backend/core/services.py", "w") as f:
              f.write(code)
          print("OK services.py fixed")

      - name: Commit
        run: |
          git config user.name "Masar Bot"
          git config user.email "bot@masar.local"
          git add -A
          git commit -m "Fix indentation error and add auto-complete" || true
          git push
