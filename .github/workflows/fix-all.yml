name: Fix views.py

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write correct views.py
        shell: python3 {0}
        run: |
          import urllib.request
          import re

          # Download current raw file
          url = "https://raw.githubusercontent.com/fmfmohanadali/masar-port-system/main/backend/core/views.py"
          req = urllib.request.Request(url)
          with urllib.request.urlopen(req) as resp:
              code = resp.read().decode("utf-8")

          # Fix 1: Fix _ensure_qr_token indentation
          old1 = """    def _ensure_qr_token(self, trip, regenerate=False):
          if regenerate or not trip.qr_token:
              trip.qr_token = trip.generate_qr_token()
              trip.save(update_fields=["qr_token"])

          if not trip.qr_image:
              trip.generate_qr_image()
          return trip"""

          new1 = """    def _ensure_qr_token(self, trip, regenerate=False):
          if regenerate or not trip.qr_token:
              trip.qr_token = trip.generate_qr_token()
              trip.save(update_fields=["qr_token"])

          if not trip.qr_image:
              trip.generate_qr_image()

          return trip"""

          if old1 in code:
              code = code.replace(old1, new1)
              print("Fix1 applied")

          # Fix 2: Remove duplicate QR lines from issue_qr if sed added them wrong
          # Find issue_qr and check for bad indentation
          lines = code.split("\n")
          fixed_lines = []
          skip_next = False
          for i, line in enumerate(lines):
              if skip_next:
                  skip_next = False
                  continue
              s = line.strip()
              # Skip duplicate/misindented generate lines
              if s == "trip.qr_token = trip.generate_qr_token()" and i > 0:
                  prev = fixed_lines[-1].strip() if fixed_lines else ""
                  # Check if this is a duplicate (already exists correctly nearby)
                  context = "\n".join(lines[max(0,i-3):min(len(lines),i+3)])
                  if context.count("trip.qr_token = trip.generate_qr_token()") > 1:
                      print(f"Removing duplicate at line {i+1}")
                      # Also skip next 2 lines (save and generate_qr_image)
                      j = i + 1
                      while j < len(lines) and j <= i + 2:
                          ns = lines[j].strip()
                          if ns in ["trip.save(update_fields=[\"qr_token\"])", "trip.generate_qr_image()", ""]:
                              j += 1
                          else:
                              break
                      continue
              fixed_lines.append(line)

          code = "\n".join(fixed_lines)

          with open("backend/core/views.py", "w") as f:
              f.write(code)

          # Verify no syntax errors
          try:
              compile(code, "views.py", "exec")
              print("OK: views.py compiles successfully")
          except SyntaxError as e:
              print(f"WARNING: Syntax error at line {e.lineno}: {e.msg}")
              print("Attempting manual fix...")

              # Nuclear option: just fix all indentation issues
              lines = code.split("\n")
              for i, line in enumerate(lines):
                  s = line.strip()
                  if s in ["if not trip.qr_image:", "trip.generate_qr_image()"]:
                      # Find surrounding indentation level
                      for j in range(i-1, max(0, i-5), -1):
                          prev = lines[j]
                          if prev.strip() and not prev.strip().startswith("#"):
                              indent = len(prev) - len(prev.lstrip())
                              if s == "if not trip.qr_image:":
                                  lines[i] = " " * indent + s
                              else:
                                  lines[i] = " " * (indent + 4) + s
                              break

              code = "\n".join(lines)
              try:
                  compile(code, "views.py", "exec")
                  print("OK: Fixed after manual adjustment")
              except SyntaxError as e2:
                  print(f"Still broken at line {e2.lineno}")

              with open("backend/core/views.py", "w") as f:
                  f.write(code)

      - name: Fix services.py
        shell: python3 {0}
        run: |
          with open("backend/core/services.py", "r") as f:
              code = f.read()

          changed = False

          if "TransportRequest" not in code:
              code = code.replace(
                  "Trip, ScanPoint, ScanEvent, Notification, AuditLog",
                  "Trip, ScanPoint, ScanEvent, Notification, AuditLog, TransportRequest"
              )
              changed = True

          if "AUTO_COMPLETE" not in code:
              old = "    return trip, event"
              idx = code.rfind(old)
              if idx > 0:
                  new_lines = [
                      "",
                      "    # Auto-complete TransportRequest when trip is DELIVERED",
                      "    if trip.status == 'DELIVERED':",
                      "        try:",
                      "            tr = TransportRequest.objects.filter(",
                      "                linked_trip=trip",
                      "            ).exclude(status__in=['COMPLETED', 'CANCELLED']).first()",
                      "            if tr:",
                      "                tr.status = 'COMPLETED'",
                      "                tr.save(update_fields=['status', 'updated_at'])",
                      "                create_notification(tr.requester, 'طلب نقل مكتمل',",
                      "                    'تم إكمال طلب النقل بنجاح')",
                      "                audit(user, 'AUTO_COMPLETE', 'TransportRequest',",
                      "                    tr.id, 'Auto-completed')",
                      "        except Exception as e:",
                      "            logger.error('auto-complete failed')",
                      "",
                      "    return trip, event",
                  ]
                  code = code[:idx] + "\n".join(new_lines) + code[idx + len(old):]
                  changed = True

          if changed:
              with open("backend/core/services.py", "w") as f:
                  f.write(code)
              print("OK: services.py updated")

      - name: Verify Python files
        run: |
          cd backend
          python3 -c "import py_compile; py_compile.compile('core/views.py', doraise=True)" && echo "views.py OK" || echo "views.py has errors"
          python3 -c "import py_compile; py_compile.compile('core/services.py', doraise=True)" && echo "services.py OK" || echo "services.py has errors"

      - name: Commit
        run: |
          git config user.name "Masar Bot"
          git config user.email "bot@masar.local"
          git add -A
          git commit -m "Fix views.py indentation + add auto-complete" || true
          git push
