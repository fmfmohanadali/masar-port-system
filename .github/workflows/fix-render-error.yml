name: "🔧 Fix Render 500 Error"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'اكتب "yes" للتأكيد'
        required: true
        default: 'no'

permissions:
  contents: write

jobs:
  fix-error:
    if: github.event.inputs.confirm == 'yes'
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: "🔧 Fix build.sh - NO migrate here (DB not ready during build)"
        run: |
          cat > backend/build.sh << 'EOF'
          #!/usr/bin/env bash
          set -o errexit

          pip install -r requirements.txt
          cd backend
          python manage.py collectstatic --noinput
          # NOTE: migrate runs in start.sh, NOT here
          # because Render DB may not be available during build
          EOF
          chmod +x backend/build.sh

      - name: "🔧 Fix start.sh - migrate here + match new model choices"
        run: |
          cat > backend/start.sh << 'STARTEOF'
          #!/usr/bin/env bash
          set -o errexit
          cd backend

          echo "🔄 Running migrations..."
          # Retry migrate up to 3 times (Render free DB may be slow to wake)
          for i in 1 2 3; do
            python manage.py migrate --noinput && break
            echo "⏳ Retry $i - waiting for database..."
            sleep 5
          done

          echo "📦 Seeding data (if needed)..."
          python manage.py shell -c "
          from datetime import date, timedelta
          from django.contrib.auth.models import User
          from core.models import UserProfile, BookingSlot, ScanPoint

          # Users
          admin, _ = User.objects.get_or_create(username='admin1', defaults={'email': 'admin@example.com'})
          admin.is_staff = True
          admin.is_superuser = True
          admin.set_password('Admin@12345')
          admin.save()
          admin_profile, _ = UserProfile.objects.get_or_create(user=admin)
          admin_profile.role = 'port_admin'
          admin_profile.save()

          ops, _ = User.objects.get_or_create(username='ops1', defaults={'email': 'ops@example.com'})
          ops.is_staff = True
          ops.is_superuser = False
          ops.set_password('Ops@12345')
          ops.save()
          ops_profile, _ = UserProfile.objects.get_or_create(user=ops)
          ops_profile.role = 'ops'
          ops_profile.save()

          # Scan Points - MUST match POINT_CHOICES in models.py
          points = [
              ('بوابة الدخول', 'ENTRY_GATE'),
              ('الرصيف', 'BERTH'),
              ('منطقة الجمارك', 'CUSTOMS_ZONE'),
              ('بوابة الخروج', 'EXIT_GATE'),
              ('التسليم', 'DELIVERY'),
          ]
          for name, pt in points:
              ScanPoint.objects.get_or_create(name=name, point_type=pt, defaults={'is_active': True})

          # Booking Slots
          if not BookingSlot.objects.filter(date__gte=date.today()).exists():
              WEEKDAY_RULES = {
                  0: {'hours': [8,9,10,11,12,13,14,15], 'capacity': 30},
                  1: {'hours': [8,9,10,11,12,13,14,15], 'capacity': 30},
                  2: {'hours': [8,9,10,11,12,13,14,15], 'capacity': 30},
                  3: {'hours': [8,9,10,11,12], 'capacity': 20},
                  4: {'hours': [], 'capacity': 0},
                  5: {'hours': [9,10,11,12,13], 'capacity': 15},
                  6: {'hours': [8,9,10,11,12,13,14], 'capacity': 25},
              }
              today = date.today()
              for d in range(30):
                  cur = today + timedelta(days=d)
                  rule = WEEKDAY_RULES.get(cur.weekday(), {'hours': [], 'capacity': 0})
                  for h in rule['hours']:
                      BookingSlot.objects.get_or_create(
                          date=cur, hour=h,
                          defaults={'capacity': rule['capacity'], 'is_closed': False}
                      )
              print('Booking slots created')
          else:
              print('Booking slots already exist, skipping')
          " || echo "⚠️ Seeding skipped (non-critical)"

          echo "🚀 Starting server..."
          exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
          STARTEOF
          chmod +x backend/start.sh

      - name: "🔧 Fix settings.py - proper DATABASE_URL with SSL"
        run: |
          cat > backend/config/settings.py << 'SETTINGSEOF'
          import os
          from pathlib import Path
          import dj_database_url

          BASE_DIR = Path(__file__).resolve().parent.parent

          SECRET_KEY = os.environ.get(
              "SECRET_KEY",
              "django-insecure-dev-only-change-in-production-!@#$%"
          )

          DEBUG = os.environ.get("DEBUG", "False") == "True"

          ALLOWED_HOSTS = os.environ.get(
              "ALLOWED_HOSTS",
              "masar-backend-oxnm.onrender.com,localhost,127.0.0.1"
          ).split(",")

          INSTALLED_APPS = [
              "django.contrib.admin",
              "django.contrib.auth",
              "django.contrib.contenttypes",
              "django.contrib.sessions",
              "django.contrib.messages",
              "django.contrib.staticfiles",
              "rest_framework",
              "rest_framework.authtoken",
              "corsheaders",
              "django_filters",
              "core",
          ]

          MIDDLEWARE = [
              "django.middleware.security.SecurityMiddleware",
              "whitenoise.middleware.WhiteNoiseMiddleware",
              "corsheaders.middleware.CorsMiddleware",
              "django.contrib.sessions.middleware.SessionMiddleware",
              "django.middleware.common.CommonMiddleware",
              "django.middleware.csrf.CsrfViewMiddleware",
              "django.contrib.auth.middleware.AuthenticationMiddleware",
              "django.contrib.messages.middleware.MessageMiddleware",
              "django.middleware.clickjacking.XFrameOptionsMiddleware",
              "core.middleware.RequestLoggingMiddleware",
          ]

          ROOT_URLCONF = "config.urls"

          TEMPLATES = [
              {
                  "BACKEND": "django.template.backends.django.DjangoTemplates",
                  "DIRS": [BASE_DIR / "templates"],
                  "APP_DIRS": True,
                  "OPTIONS": {
                      "context_processors": [
                          "django.template.context_processors.request",
                          "django.contrib.auth.context_processors.auth",
                          "django.contrib.messages.context_processors.messages",
                      ],
                  },
              },
          ]

          WSGI_APPLICATION = "config.wsgi.application"

          # --- Database Configuration ---
          DATABASE_URL = os.environ.get("DATABASE_URL")

          if DATABASE_URL:
              # Render / Production: always use DATABASE_URL when available
              DATABASES = {
                  "default": dj_database_url.config(
                      default=DATABASE_URL,
                      conn_max_age=600,
                      ssl_require=True,
                  )
              }
          else:
              DB_ENGINE = os.environ.get("DB_ENGINE", "sqlite")
              if DB_ENGINE == "postgres":
                  DATABASES = {
                      "default": {
                          "ENGINE": "django.db.backends.postgresql",
                          "NAME": os.environ.get("DB_NAME", "masar"),
                          "USER": os.environ.get("DB_USER", "postgres"),
                          "PASSWORD": os.environ.get("DB_PASSWORD", "postgres"),
                          "HOST": os.environ.get("DB_HOST", "db"),
                          "PORT": os.environ.get("DB_PORT", "5432"),
                          "CONN_MAX_AGE": 600,
                      }
                  }
              else:
                  DATABASES = {
                      "default": {
                          "ENGINE": "django.db.backends.sqlite3",
                          "NAME": BASE_DIR / "db.sqlite3",
                      }
                  }

          LANGUAGE_CODE = "ar"
          TIME_ZONE = os.environ.get("TIME_ZONE", "Asia/Aden")
          USE_I18N = True
          USE_TZ = True

          STATIC_URL = "/static/"
          STATIC_ROOT = BASE_DIR / "staticfiles"

          STORAGES = {
              "staticfiles": {
                  "BACKEND": "whitenoise.storage.CompressedManifestStaticFilesStorage",
              },
          }

          MEDIA_URL = "/media/"
          MEDIA_ROOT = os.path.join(BASE_DIR, "media")

          REST_FRAMEWORK = {
              "DEFAULT_AUTHENTICATION_CLASSES": [
                  "rest_framework.authentication.TokenAuthentication",
              ],
              "DEFAULT_PAGINATION_CLASS": "rest_framework.pagination.PageNumberPagination",
              "PAGE_SIZE": 20,
              "DEFAULT_THROTTLE_CLASSES": [
                  "rest_framework.throttling.AnonRateThrottle",
                  "rest_framework.throttling.UserRateThrottle",
              ],
              "DEFAULT_THROTTLE_RATES": {
                  "anon": "30/minute",
                  "user": "120/minute",
                  "login": "5/minute",
              },
              "DEFAULT_FILTER_BACKENDS": [
                  "django_filters.rest_framework.DjangoFilterBackend",
                  "rest_framework.filters.SearchFilter",
                  "rest_framework.filters.OrderingFilter",
              ],
              "EXCEPTION_HANDLER": "core.exceptions.custom_exception_handler",
          }

          CORS_ALLOWED_ORIGINS = [
              "https://masar-mobile-vercel.vercel.app",
              "https://masar-dashboard-live.vercel.app",
          ]

          CORS_ALLOWED_ORIGIN_REGEXES = [
              r"^https://.*\.vercel\.app$",
          ]

          if DEBUG:
              CORS_ALLOW_ALL_ORIGINS = True

          SECURE_PROXY_SSL_HEADER = ("HTTP_X_FORWARDED_PROTO", "https")

          if not DEBUG:
              SECURE_SSL_REDIRECT = True
              SESSION_COOKIE_SECURE = True
              CSRF_COOKIE_SECURE = True
              SECURE_BROWSER_XSS_FILTER = True
              SECURE_CONTENT_TYPE_NOSNIFF = True
              X_FRAME_OPTIONS = "DENY"
              SECURE_HSTS_SECONDS = 31536000
              SECURE_HSTS_INCLUDE_SUBDOMAINS = True
              SECURE_HSTS_PRELOAD = True

          DEFAULT_AUTO_FIELD = "django.db.models.BigAutoField"

          LOGGING = {
              "version": 1,
              "disable_existing_loggers": False,
              "formatters": {
                  "verbose": {
                      "format": "[{asctime}] {levelname} {name} {message}",
                      "style": "{",
                  },
              },
              "handlers": {
                  "console": {
                      "class": "logging.StreamHandler",
                      "formatter": "verbose",
                  },
              },
              "loggers": {
                  "django": {
                      "handlers": ["console"],
                      "level": os.environ.get("DJANGO_LOG_LEVEL", "WARNING"),
                  },
                  "core": {
                      "handlers": ["console"],
                      "level": "INFO",
                      "propagate": False,
                  },
              },
          }

          QR_TOKEN_MAX_AGE = int(os.environ.get("QR_TOKEN_MAX_AGE", 60 * 60 * 72))
          QR_SIGNING_SALT = os.environ.get("QR_SIGNING_SALT", "masar-trip-v2")
          SETTINGSEOF

      - name: "📝 Commit fixes"
        run: |
          git config user.name "Masar Bot"
          git config user.email "bot@masar.local"
          git add -A
          git commit -m "🔧 Fix Render build failure

          Root cause: migrate in build.sh fails because Render
          PostgreSQL (free tier) is sleeping during build phase.

          Fix:
          - Remove migrate from build.sh (only collectstatic)
          - Move migrate to start.sh with 3x retry + sleep
          - Add ssl_require=True for Render PostgreSQL
          - Prioritize DATABASE_URL over DB_ENGINE
          - Fix ScanPoint seed values to match new POINT_CHOICES
          - Fix admin role to 'port_admin' (valid choice)
          " || echo "No changes"
          git push

      - name: "✅ Done"
        run: |
          echo "========================================"
          echo "  🎉 تم الإصلاح!"
          echo "========================================"
          echo ""
          echo "⏭️ الخطوة التالية:"
          echo "روح Render > Manual Deploy > Deploy latest commit"
          echo ""

