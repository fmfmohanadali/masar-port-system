name: Fix views.py QR image

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fix views.py
        shell: python3 {0}
        run: |
          with open("backend/core/views.py", "r") as f:
              code = f.read()

          # Wrap ALL generate_qr_image() calls with try/except
          code = code.replace(
              "            trip.generate_qr_image()\n",
              "            try:\n                trip.generate_qr_image()\n            except Exception:\n                pass\n"
          )

          with open("backend/core/views.py", "w") as f:
              f.write(code)

          import py_compile
          py_compile.compile("backend/core/views.py", doraise=True)
          print("OK")

      - name: Commit
        run: |
          git config user.name "Masar Bot"
          git config user.email "bot@masar.local"
          git add -A
          git commit -m "Fix views.py: handle QR image failure gracefully" || true
          git push
